<!doctype html>
<html lang="th">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark">
    <meta name="format-detection" content="telephone=no">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kanit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    >

    <style>
  :root {
    --bg: #020a07;
    --bg-soft: #061b13;
    --panel: rgba(5, 28, 19, 0.72);
    --green: #16d878;
    --green-bright: #33f295;
    --green-dark: #087a49;
    --gold: #e5bd65;
    --gold-bright: #ffe6a3;
    --white: #f7fff9;
    --muted: rgba(237, 255, 244, 0.66);
    --line: rgba(229, 189, 101, 0.28);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * {
    box-sizing: border-box;
  }

  html {
    min-width: 320px;
    background: var(--bg);
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    min-width: 320px;
    min-height: 100vh;
    min-height: 100svh;
    overflow-x: hidden;
    color: var(--white);
    background: var(--bg);
    font-family: "Inter", "Kanit", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  a,
  button {
    -webkit-tap-highlight-color: transparent;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  button {
    font: inherit;
  }

  svg {
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .noscript-message {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    padding: 24px;
    color: #fff;
    background: #020a07;
    text-align: center;
    font-family: "Kanit", sans-serif;
  }

  .page-loader {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: grid;
    place-content: center;
    gap: 18px;
    background:
      radial-gradient(circle at 50% 50%, rgba(25, 197, 110, 0.16), transparent 34%),
      #020a07;
    transition: opacity 420ms ease, visibility 420ms ease;
  }

  .page-loader.is-hidden {
    opacity: 0;
    visibility: hidden;
  }

  .loader-mark {
    width: 68px;
    height: 68px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(229, 189, 101, 0.45);
    border-radius: 22px;
    color: var(--gold-bright);
    background: rgba(5, 28, 19, 0.76);
    box-shadow: 0 0 40px rgba(23, 216, 120, 0.16);
    font-size: 34px;
    font-weight: 800;
  }

  .loader-bar {
    width: 92px;
    height: 3px;
    overflow: hidden;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.08);
  }

  .loader-bar span {
    display: block;
    width: 50%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--gold), var(--green-bright));
    animation: loading-slide 900ms ease-in-out infinite alternate;
  }

  .landing {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(circle at 80% 25%, rgba(18, 210, 112, 0.15), transparent 32%),
      linear-gradient(135deg, #020906 0%, #04150e 45%, #071e15 100%);
  }

  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    padding: 0 5vw;
  }

  .grid-texture {
    position: absolute;
    inset: 0;
    z-index: -1;
    opacity: 0.16;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.032) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.032) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: linear-gradient(to right, #000, transparent 85%);
  }

  .ambient {
    position: absolute;
    z-index: -1;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(1px);
  }

  .ambient-one {
    width: 28vw;
    height: 28vw;
    left: -10vw;
    bottom: -10vw;
    background: rgba(15, 168, 89, 0.12);
    box-shadow: 0 0 140px rgba(15, 168, 89, 0.16);
  }

  .ambient-two {
    width: 18vw;
    height: 18vw;
    right: 4vw;
    top: 8vh;
    background: rgba(229, 189, 101, 0.09);
    box-shadow: 0 0 100px rgba(229, 189, 101, 0.14);
  }

  .hero-media {
    position: absolute;
    z-index: -1;
    top: 0;
    right: 0;
    width: min(62vw, 980px);
    height: 100%;
    overflow: hidden;
    background: #06170f;
  }

  .poster-fallback,
  .hero-video,
  .media-shadow,
  .media-vignette,
  .media-scan {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .poster-fallback {
    background-position: center;
    background-size: cover;
    opacity: 0.95;
    transform: scale(1.015);
  }

  .hero-video {
    border: 0;
    object-fit: cover;
    object-position: 56% center;
    opacity: 0;
    transform: scale(1.015);
    transition: opacity 700ms ease;
  }

  .hero-video.is-ready {
    opacity: 1;
  }

  .media-shadow {
    background:
      linear-gradient(90deg, var(--bg) 0%, rgba(2, 10, 7, 0.97) 8%, rgba(2, 10, 7, 0.7) 28%, rgba(2, 10, 7, 0.08) 70%),
      linear-gradient(0deg, rgba(2, 10, 7, 0.64), transparent 35%, rgba(2, 10, 7, 0.12));
  }

  .media-vignette {
    box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.48);
    background: radial-gradient(circle at 60% 40%, transparent 30%, rgba(2, 10, 7, 0.38) 100%);
  }

  .media-scan {
    opacity: 0.18;
    mix-blend-mode: screen;
    background: linear-gradient(
      112deg,
      transparent 25%,
      rgba(61, 255, 160, 0.08) 42%,
      rgba(255, 226, 153, 0.12) 50%,
      transparent 58%
    );
    background-size: 260% 100%;
    animation: light-sweep 8s ease-in-out infinite;
  }

  .topbar {
    position: relative;
    z-index: 5;
    width: 100%;
    min-height: 92px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 22px 0;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    min-height: 48px;
  }

  .brand-image {
    display: block;
    width: auto;
    max-width: 220px;
    height: 52px;
    object-fit: contain;
    border-radius: 12px;
  }

  .brand-fallback {
    position: relative;
    font-size: clamp(1.55rem, 2.2vw, 2.25rem);
    font-weight: 800;
    letter-spacing: -0.055em;
    line-height: 1;
    color: #fff;
  }

  .brand-fallback::before {
    content: "";
    position: absolute;
    width: 34px;
    height: 3px;
    left: 0;
    bottom: -10px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--gold), var(--green-bright));
  }

  .brand-fallback span {
    color: var(--gold-bright);
    text-shadow: 0 0 22px rgba(229, 189, 101, 0.24);
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .top-line,
  .top-register {
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
  }

  .top-line {
    padding: 0 17px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: rgba(255, 255, 255, 0.88);
    background: rgba(2, 10, 7, 0.42);
    backdrop-filter: blur(12px);
  }

  .top-line svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
    stroke: none;
  }

  .top-register {
    padding: 0 20px;
    border: 1px solid rgba(229, 189, 101, 0.5);
    color: #072014;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    box-shadow: 0 8px 30px rgba(229, 189, 101, 0.14);
  }

  .top-register svg {
    width: 16px;
    height: 16px;
  }

  .top-line:hover,
  .top-register:hover,
  .top-line:focus-visible,
  .top-register:focus-visible {
    transform: translateY(-2px);
  }

  .hero-layout {
    position: relative;
    z-index: 2;
    width: 100%;
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 0.98fr) minmax(360px, 1.02fr);
    align-items: center;
    padding: 3vh 0 13vh;
  }

  .hero-copy {
    width: min(100%, 690px);
    padding: 18px 0;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: clamp(18px, 2vw, 28px);
    color: rgba(237, 255, 244, 0.76);
    font-family: "Kanit", sans-serif;
    font-size: clamp(0.68rem, 0.88vw, 0.86rem);
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .crown {
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    color: var(--gold-bright);
    border: 1px solid rgba(229, 189, 101, 0.28);
    border-radius: 10px;
    background: rgba(229, 189, 101, 0.08);
  }

  .crown svg {
    width: 16px;
    height: 16px;
  }

  .hero-title {
    margin: 0;
    font-family: "Kanit", sans-serif;
    font-size: clamp(3.65rem, 7.2vw, 7.3rem);
    font-weight: 800;
    line-height: 0.88;
    letter-spacing: -0.065em;
    text-wrap: balance;
    text-shadow: 0 10px 50px rgba(0, 0, 0, 0.44);
  }

  .hero-title span {
    display: block;
  }

  .hero-title .accent-line {
    width: fit-content;
    color: var(--green-bright);
    text-shadow: 0 0 42px rgba(51, 242, 149, 0.16);
  }

  .hero-description {
    max-width: 560px;
    margin: clamp(22px, 2.7vw, 36px) 0 0;
    color: var(--muted);
    font-family: "Kanit", sans-serif;
    font-size: clamp(0.96rem, 1.12vw, 1.16rem);
    font-weight: 400;
    line-height: 1.72;
  }

  .hero-description strong {
    color: rgba(247, 255, 249, 0.94);
    font-weight: 500;
  }

  .cta-stack {
    width: min(100%, 510px);
    display: grid;
    gap: 12px;
    margin-top: clamp(24px, 3vw, 38px);
  }

  .cta {
    position: relative;
    min-height: 70px;
    display: grid;
    grid-template-columns: 45px 1fr 24px;
    align-items: center;
    gap: 13px;
    overflow: hidden;
    padding: 10px 18px;
    border-radius: 18px;
    font-family: "Kanit", sans-serif;
    transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
  }

  .cta::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    background: linear-gradient(110deg, transparent 20%, rgba(255, 255, 255, 0.18) 50%, transparent 80%);
    transform: translateX(-100%);
    transition: opacity 180ms ease;
  }

  .cta:hover,
  .cta:focus-visible {
    transform: translateY(-2px);
  }

  .cta:hover::after,
  .cta:focus-visible::after {
    opacity: 1;
    animation: button-shine 760ms ease;
  }

  .cta-primary {
    color: #fff;
    border: 1px solid rgba(88, 255, 172, 0.55);
    background:
      linear-gradient(135deg, rgba(11, 158, 85, 0.98), rgba(4, 92, 54, 0.98)),
      #087a49;
    box-shadow:
      0 18px 48px rgba(4, 117, 66, 0.26),
      inset 0 1px rgba(255, 255, 255, 0.14);
  }

  .cta-primary:hover,
  .cta-primary:focus-visible {
    box-shadow:
      0 20px 58px rgba(23, 216, 120, 0.32),
      inset 0 1px rgba(255, 255, 255, 0.18);
  }

  .cta-secondary {
    color: rgba(255, 244, 213, 0.94);
    border: 1px solid rgba(229, 189, 101, 0.4);
    background: rgba(4, 19, 13, 0.72);
    backdrop-filter: blur(14px);
    box-shadow: inset 0 1px rgba(255, 255, 255, 0.04);
  }

  .cta-secondary:hover,
  .cta-secondary:focus-visible {
    border-color: rgba(229, 189, 101, 0.7);
    box-shadow: 0 18px 42px rgba(0, 0, 0, 0.2);
  }

  .cta-icon {
    width: 43px;
    height: 43px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    color: var(--gold-bright);
    background: rgba(255, 255, 255, 0.1);
  }

  .cta-icon svg {
    width: 23px;
    height: 23px;
  }

  .cta-icon.line-icon svg {
    fill: currentColor;
    stroke: none;
  }

  .cta > span:nth-child(2) {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    font-size: 1.05rem;
    font-weight: 600;
    line-height: 1.25;
  }

  .cta small {
    margin-bottom: 2px;
    opacity: 0.66;
    font-family: "Inter", "Kanit", sans-serif;
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  .cta-arrow {
    width: 22px;
    height: 22px;
    transition: transform 180ms ease;
  }

  .cta:hover .cta-arrow,
  .cta:focus-visible .cta-arrow {
    transform: translate(2px, -2px);
  }

  .features {
    width: min(100%, 630px);
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin-top: clamp(24px, 3vw, 40px);
  }

  .feature {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 11px;
    padding-right: 12px;
    border-right: 1px solid rgba(255, 255, 255, 0.09);
  }

  .feature:last-child {
    border-right: 0;
  }

  .feature-icon {
    width: 34px;
    height: 34px;
    flex: 0 0 34px;
    display: grid;
    place-items: center;
    color: var(--gold-bright);
    border: 1px solid rgba(229, 189, 101, 0.22);
    border-radius: 11px;
    background: rgba(229, 189, 101, 0.06);
  }

  .feature-icon svg {
    width: 18px;
    height: 18px;
  }

  .feature > span:last-child {
    min-width: 0;
    display: flex;
    flex-direction: column;
    font-family: "Kanit", sans-serif;
  }

  .feature strong {
    overflow: hidden;
    color: rgba(247, 255, 249, 0.92);
    font-size: 0.77rem;
    font-weight: 500;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .feature small {
    overflow: hidden;
    margin-top: 2px;
    color: rgba(237, 255, 244, 0.45);
    font-size: 0.62rem;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .responsible-note {
    position: absolute;
    z-index: 4;
    left: 5vw;
    bottom: 24px;
    max-width: 650px;
    display: flex;
    align-items: center;
    gap: 9px;
    color: rgba(237, 255, 244, 0.38);
    font-family: "Kanit", sans-serif;
    font-size: 0.66rem;
    line-height: 1.35;
  }

  .age-badge {
    flex: 0 0 auto;
    padding: 3px 8px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px;
    color: rgba(255, 255, 255, 0.62);
    font-family: "Inter", sans-serif;
    font-weight: 700;
  }

  .motion-toggle {
    position: absolute;
    z-index: 7;
    right: 22px;
    bottom: 22px;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 50%;
    color: rgba(255, 255, 255, 0.78);
    background: rgba(2, 10, 7, 0.52);
    backdrop-filter: blur(12px);
    cursor: pointer;
    transition: border-color 180ms ease, background 180ms ease;
  }

  .motion-toggle:hover,
  .motion-toggle:focus-visible {
    border-color: rgba(229, 189, 101, 0.52);
    background: rgba(2, 10, 7, 0.78);
  }

  .motion-toggle svg {
    width: 18px;
    height: 18px;
  }

  .motion-toggle .play-icon {
    display: none;
  }

  .motion-toggle.is-paused .pause-icon {
    display: none;
  }

  .motion-toggle.is-paused .play-icon {
    display: block;
  }

  .sticky-actions {
    display: none;
  }

  .animate-up,
  .animate-in {
    opacity: 0;
    animation-fill-mode: forwards;
  }

  .animate-up {
    transform: translateY(28px);
    animation: fade-up 760ms cubic-bezier(0.2, 0.72, 0.2, 1) forwards;
  }

  .animate-in {
    animation: fade-in 700ms ease forwards;
  }

  .delay-0 { animation-delay: 140ms; }
  .delay-1 { animation-delay: 300ms; }
  .delay-2 { animation-delay: 480ms; }
  .delay-3 { animation-delay: 660ms; }
  .delay-4 { animation-delay: 840ms; }
  .delay-5 { animation-delay: 1020ms; }

  :focus-visible {
    outline: 2px solid var(--gold-bright);
    outline-offset: 4px;
  }

  @media (max-width: 1180px) {
    .hero-layout {
      grid-template-columns: minmax(0, 1.08fr) minmax(300px, 0.92fr);
    }

    .hero-media {
      width: 58vw;
    }

    .hero-title {
      font-size: clamp(3.5rem, 7vw, 6.1rem);
    }
  }

  @media (max-width: 767px) {
    body {
      padding-bottom: calc(74px + var(--safe-bottom));
    }

    .landing,
    .hero {
      min-height: 100svh;
    }

    .hero {
      padding: 0 20px;
    }

    .grid-texture {
      opacity: 0.09;
      background-size: 38px 38px;
    }

    .hero-media {
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.9;
    }

    .hero-video {
      object-position: 62% center;
    }

    .media-shadow {
      background:
        linear-gradient(90deg, rgba(2, 10, 7, 0.98) 0%, rgba(2, 10, 7, 0.84) 42%, rgba(2, 10, 7, 0.28) 100%),
        linear-gradient(0deg, rgba(2, 10, 7, 0.88) 0%, rgba(2, 10, 7, 0.04) 48%, rgba(2, 10, 7, 0.3) 100%);
    }

    .media-vignette {
      background: radial-gradient(circle at 70% 34%, transparent 18%, rgba(2, 10, 7, 0.55) 100%);
    }

    .topbar {
      min-height: 74px;
      padding: 13px 0;
    }

    .brand-fallback {
      font-size: 1.45rem;
    }

    .brand-image {
      max-width: 150px;
      height: 42px;
      border-radius: 9px;
    }

    .top-actions {
      gap: 8px;
    }

    .top-line {
      min-height: 40px;
      padding: 0 13px;
    }

    .top-register {
      display: none;
    }

    .hero-layout {
      display: flex;
      align-items: center;
      padding: 1.5vh 0 13vh;
    }

    .hero-copy {
      width: min(100%, 560px);
      padding: 6px 0;
    }

    .eyebrow {
      max-width: 78vw;
      gap: 9px;
      margin-bottom: 18px;
      font-size: 0.66rem;
      letter-spacing: 0.08em;
    }

    .crown {
      width: 26px;
      height: 26px;
      border-radius: 9px;
    }

    .hero-title {
      max-width: 92vw;
      font-size: clamp(3.2rem, 16.4vw, 5.7rem);
      line-height: 0.88;
      letter-spacing: -0.07em;
    }

    .hero-description {
      max-width: 88vw;
      margin-top: 20px;
      padding-right: 8vw;
      font-size: 0.87rem;
      line-height: 1.65;
    }

    .cta-stack {
      width: min(100%, 430px);
      gap: 10px;
      margin-top: 22px;
    }

    .cta {
      min-height: 62px;
      grid-template-columns: 39px 1fr 20px;
      gap: 11px;
      padding: 8px 14px;
      border-radius: 16px;
    }

    .cta-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
    }

    .cta-icon svg {
      width: 20px;
      height: 20px;
    }

    .cta > span:nth-child(2) {
      font-size: 0.94rem;
    }

    .cta small {
      font-size: 0.6rem;
    }

    .features {
      width: min(100%, 500px);
      gap: 7px;
      margin-top: 18px;
    }

    .feature {
      display: grid;
      justify-items: center;
      gap: 6px;
      padding: 0 4px;
      text-align: center;
    }

    .feature-icon {
      width: 31px;
      height: 31px;
      flex-basis: 31px;
      border-radius: 10px;
    }

    .feature strong {
      font-size: 0.64rem;
    }

    .feature small {
      display: none;
    }

    .responsible-note {
      position: absolute;
      left: 20px;
      right: 72px;
      bottom: 12px;
      font-size: 0.54rem;
    }

    .motion-toggle {
      right: 18px;
      bottom: 12px;
      width: 38px;
      height: 38px;
    }

    .sticky-actions {
      position: fixed;
      z-index: 50;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(68px + var(--safe-bottom));
      display: grid;

    <script>
  (() => {
    'use strict';

    const config = window.APP_CONFIG || {};
    const trackingKeys = [
      'utm_source',
      'utm_medium',
      'utm_campaign',
      'utm_content',
      'utm_term',
      'fbclid',
      'gclid',
      'ttclid'
    ];

    const pageParams = new URLSearchParams(window.location.search);
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function byId(id) {
      return document.getElementById(id);
    }

    function setText(id, value) {
      const node = byId(id);
      if (node) node.textContent = value || '';
    }

    function isConfiguredUrl(value) {
      if (typeof value !== 'string' || !value.trim() || value.includes('PASTE_PUBLIC_')) {
        return false;
      }

      return /^https:\/\//i.test(value) || /^(?:\.\/|\/|assets\/)/i.test(value);
    }

    function appendTracking(baseUrl) {
      try {
        const url = new URL(baseUrl);

        trackingKeys.forEach((key) => {
          const value = pageParams.get(key);
          if (value && !url.searchParams.has(key)) {
            url.searchParams.set(key, value);
          }
        });

        url.searchParams.set('lp', 'venicevip_appscript');
        return url.toString();
      } catch (error) {
        console.error('Invalid destination URL:', baseUrl, error);
        return baseUrl || '#';
      }
    }

    function setDestinationLinks() {
      const registerUrl = appendTracking(config.registerUrl);
      const lineUrl = appendTracking(config.lineUrl);

      document.querySelectorAll('.js-register-link').forEach((link) => {
        link.href = registerUrl;
        link.rel = 'noopener noreferrer';
      });

      document.querySelectorAll('.js-line-link').forEach((link) => {
        link.href = lineUrl;
        link.rel = 'noopener noreferrer';
      });
    }

    function loadGa4(id) {
      if (!id || !/^G-[A-Z0-9]+$/i.test(id)) return;

      window.dataLayer = window.dataLayer || [];
      window.gtag = function () {
        window.dataLayer.push(arguments);
      };

      window.gtag('js', new Date());
      window.gtag('config', id, {
        send_page_view: true,
        page_title: document.title,
        page_location: window.location.href
      });

      const script = document.createElement('script');
      script.async = true;
      script.src = `https://www.googletagmanager.com/gtag/js?id=${encodeURIComponent(id)}`;
      document.head.appendChild(script);
    }

    function loadMetaPixel(id) {
      if (!id || !/^\d{5,20}$/.test(id)) return;

      /* Meta Pixel base loader */
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = true;
        n.version = '2.0';
        n.queue = [];
        t = b.createElement(e);
        t.async = true;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');

      window.fbq('init', id);
      window.fbq('track', 'PageView');
    }

    function trackEvent(eventName, properties = {}) {
      const payload = {
        ...properties,
        page_path: window.location.pathname,
        utm_source: pageParams.get('utm_source') || undefined,
        utm_campaign: pageParams.get('utm_campaign') || undefined,
        utm_content: pageParams.get('utm_content') || undefined
      };

      if (typeof window.gtag === 'function') {
        window.gtag('event', eventName, {
          ...payload,
          transport_type: 'beacon'
        });
      }

      if (typeof window.fbq === 'function') {
        const metaName = eventName.startsWith('register') ? 'Lead' : 'Contact';
        window.fbq('track', metaName, {
          content_name: eventName,
          ...payload
        });
      }
    }

    function attachClickTracking() {
      document.querySelectorAll('[data-track]').forEach((element) => {
        element.addEventListener('click', () => {
          trackEvent(element.dataset.track || 'cta_click', {
            destination: element.href || ''
          });
        });
      });
    }

    function setupContent() {
      setText('eyebrowText', config.eyebrow);
      setText('headingLine1', config.headingLine1);
      setText('headingLine2', config.headingLine2);
      setText('headingLine3', config.headingLine3);
      setText('descriptionLine1', config.descriptionLine1);
      setText('descriptionLine2', config.descriptionLine2);
      setText('minimumAgeText', config.minimumAgeText);

      const brandImage = byId('brandImage');
      const brandFallback = byId('brandFallback');

      if (isConfiguredUrl(config.logoUrl) && brandImage) {
        brandImage.src = config.logoUrl;
        brandImage.hidden = false;
        if (brandFallback) brandFallback.hidden = true;
      }
    }

    function setupMedia() {
      const video = byId('heroVideo');
      const poster = byId('posterFallback');
      const toggle = byId('motionToggle');

      if (poster && isConfiguredUrl(config.posterUrl)) {
        poster.style.backgroundImage = `url("${config.posterUrl.replace(/"/g, '%22')}")`;
      }

      if (!video || !isConfiguredUrl(config.videoUrl) || reducedMotion) {
        if (video) video.remove();
        if (toggle) toggle.hidden = true;
        return;
      }

      if (isConfiguredUrl(config.posterUrl)) {
        video.poster = config.posterUrl;
      }

      video.src = config.videoUrl;

      const markReady = () => {
        video.classList.add('is-ready');
      };

      video.addEventListener('loadeddata', markReady, { once: true });
      video.addEventListener('canplay', markReady, { once: true });
      video.addEventListener('error', () => {
        video.classList.remove('is-ready');
        if (toggle) toggle.hidden = true;
      });

      const attemptPlay = () => {
        const promise = video.play();
        if (promise && typeof promise.catch === 'function') {
          promise.catch(() => {
            if (toggle) {
              toggle.classList.add('is-paused');
              toggle.setAttribute('aria-pressed', 'true');
            }
          });
        }
      };

      attemptPlay();

      if (toggle) {
        toggle.addEventListener('click', () => {
          if (video.paused) {
            video.play().catch(() => {});
            toggle.classList.remove('is-paused');
            toggle.setAttribute('aria-pressed', 'false');
            toggle.setAttribute('aria-label', 'หยุดภาพเคลื่อนไหว');
            trackEvent('motion_play');
          } else {
            video.pause();
            toggle.classList.add('is-paused');
            toggle.setAttribute('aria-pressed', 'true');
            toggle.setAttribute('aria-label', 'เล่นภาพเคลื่อนไหว');
            trackEvent('motion_pause');
          }
        });
      }

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          video.pause();
        } else if (!toggle || !toggle.classList.contains('is-paused')) {
          attemptPlay();
        }
      });
    }

    function hideLoader() {
      const loader = byId('pageLoader');
      if (!loader) return;

      window.setTimeout(() => {
        loader.classList.add('is-hidden');
        window.setTimeout(() => loader.remove(), 500);
      }, 240);
    }

    function init() {
      setupContent();
      setDestinationLinks();
      loadGa4(config.ga4MeasurementId);
      loadMetaPixel(config.metaPixelId);
      attachClickTracking();
      setupMedia();
      hideLoader();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init, { once: true });
    } else {
      init();
    }
  })();
</script>
